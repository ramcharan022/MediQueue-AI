spring:
  application:
    name: queueless-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/queueless?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5174,http://localhost:5174,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    bootstrap-token: ${ADMIN_BOOTSTRAP_TOKEN:}
